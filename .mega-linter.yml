---
DISABLE_LINTERS:
  - COPYPASTE_JSCPD
  - CSS_SCSSLINT
  - CSS_STYLELINT
  - JAVASCRIPT_ES
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - SPELL_CSPELL
  - SPELL_MISSPELL
  - TSX_ESLINT
  - TYPESCRIPT_ES
  - TYPESCRIPT_STANDARD
  - REPOSITORY_TRIVY
JSON_JSONLINT_ARGUMENTS: --comments
# zizmor needs GitHub API access to audit `uses:` references; the runner's GITHUB_TOKEN is
# sandboxed out of linter subprocesses by default unless explicitly whitelisted here.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
# index.html's favicon links are root-relative (e.g. /favicons/...), which lychee can only
# resolve against the actual site root (public/), not the repo root it runs from by default.
SPELL_LYCHEE_ARGUMENTS: --root-dir ./public
# osv-scanner and zizmor are both new in this MegaLinter bump and surface real,
# pre-existing issues unrelated to this PR's diff: osv-scanner finds 134 CVEs in
# yarn.lock; zizmor finds 46 findings across all 4 workflow files (16 high-confidence
# unpinned `uses:` refs, plus artipacked/template-injection/etc.) -- repo-wide Actions
# hardening, not this ticket's scope. One of the unpinned refs, actions/checkout@master
# in ci.yml, is a genuinely riskier floating-branch ref worth a dedicated follow-up.
# Both linters are kept enabled and visible, but non-blocking so they don't gate
# unrelated PRs -- note this also means a *new* finding introduced by a future PR
# won't block it either; a scoped per-finding suppression would be more precise but
# is a larger effort than this ticket's scope.
DISABLE_ERRORS_LINTERS:
  - REPOSITORY_OSV_SCANNER
  - ACTION_ZIZMOR
